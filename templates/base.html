<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Sanctum Locker
        {% endblock %}
    </title>

    <!-- Font Awesome CDN -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main stylesheet -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


    <!-- =========================
         NAVIGATION BAR
         ========================= -->

    <nav class="navbar">


        <!-- Logo -->

        <a href="{{ url_for('index') }}"
           class="logo">

            <span class="logo-icon">
                <i class="fa-solid fa-lock"></i>
            </span>

            <span>
                Sanctum Locker
            </span>

        </a>



        <!-- Navigation Links -->

        <div class="nav-links">

            <a href="{{ url_for('index') }}">

                <i class="fa-solid fa-house"></i>

                <span>
                    Home
                </span>

            </a>


            <a href="{{ url_for('lock_page') }}">

                <i class="fa-solid fa-lock"></i>

                <span>
                    Lock File
                </span>

            </a>


            <a href="{{ url_for('unlock_page') }}">

                <i class="fa-solid fa-lock-open"></i>

                <span>
                    Unlock File
                </span>

            </a>

        </div>


    </nav>



    <!-- =========================
         FLASH MESSAGES
         ========================= -->

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message">

                        <i class="fa-solid fa-circle-exclamation"></i>

                        <span>
                            {{ message }}
                        </span>

                    </div>

                {% endfor %}

            </div>

        {% endif %}

    {% endwith %}



    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main>

        {% block content %}

        {% endblock %}

    </main>



    <!-- =========================
         FOOTER
         ========================= -->

    <footer>

        <div class="footer-content">

            <span class="footer-brand">
                <i class="fa-solid fa-lock"></i>
                Sanctum Locker
            </span>

            <span class="footer-separator">
                •
            </span>

            <span>
                Secure File Locking
            </span>

        </div>

    </footer>


</body>

</html>
